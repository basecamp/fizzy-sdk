# Naming overrides for the Rust generator.
#
# Fizzy's OpenAPI tags no operation, so the service an operation files under comes from its
# id: an [operation_services] override, else the first [[service_suffixes]] rule its id ends
# in, tried in the order written. The rules and overrides are Go's (go/cmd/generate-services),
# so every SDK files an operation under the same service. Method names come from the id with
# the service's own noun removed (ListBoards -> boards().list()); [operation_methods] settles
# the ones Go names differently. The generator fails when an id matches no rule, when two
# operations in one service end up with the same method name, or when a name is a keyword.

service_suffixes = [
    { suffix = "CommentReactions", service = "reactions" },
    { suffix = "CommentReaction", service = "reactions" },
    { suffix = "CardReactions", service = "reactions" },
    { suffix = "CardReaction", service = "reactions" },
    { suffix = "Notifications", service = "notifications" },
    { suffix = "Notification", service = "notifications" },
    { suffix = "Comments", service = "comments" },
    { suffix = "Comment", service = "comments" },
    { suffix = "Webhooks", service = "webhooks" },
    { suffix = "Webhook", service = "webhooks" },
    { suffix = "Columns", service = "columns" },
    { suffix = "Column", service = "columns" },
    { suffix = "Boards", service = "boards" },
    { suffix = "Board", service = "boards" },
    { suffix = "Cards", service = "cards" },
    { suffix = "Card", service = "cards" },
    { suffix = "Steps", service = "steps" },
    { suffix = "Step", service = "steps" },
    { suffix = "Users", service = "users" },
    { suffix = "User", service = "users" },
    { suffix = "Tags", service = "tags" },
    { suffix = "Pins", service = "pins" },
    { suffix = "Session", service = "sessions" },
    { suffix = "Device", service = "devices" },
]

[operation_services]
GetMyIdentity = "identity"
UpdateMyTimezone = "identity"
CreateDirectUpload = "uploads"
RedeemMagicLink = "sessions"
CompleteJoin = "sessions"
CompleteSignup = "sessions"
