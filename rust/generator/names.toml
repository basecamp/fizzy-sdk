# The noun each service's operations act on, as the hooks report it. Nothing in OpenAPI
# says it, so it is written down here; the generator fails when a service has no entry.
[resource_types]
access_tokens = "access_token"
account = "account"
boards = "board"
cards = "card"
columns = "column"
comments = "comment"
devices = "device"
identity = "identity"
notifications = "notification"
pins = "pin"
reactions = "reaction"
search = "search"
sessions = "session"
steps = "step"
tags = "tag"
uploads = "direct_upload"
users = "user"
webhooks = "webhook"

