[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # chrono is unmaintained (no vulnerability is reported, and no maintained
  # release exists to move to). It is the crate's date and time type: the
  # generated *_at fields are chrono::DateTime<Utc>, so replacing it with jiff,
  # as basecamp-sdk did, is a breaking change of its own. Until that lands,
  # record the advisory here rather than fail every Rust check on it.
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; it is the SDK's date type, and replacing it is a separate breaking change" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
         "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CDLA-Permissive-2.0", "OpenSSL"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # the conformance runner depends on the crate by path
deny = [{ crate = "openssl-sys", reason = "rustls only; a native-tls feature would need this entry removed and its own CI leg" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
