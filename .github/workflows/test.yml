name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smithy:
    name: Smithy Verify
    uses: $/.github/workflows/smithy-verify.yml

  test-go:
    name: Go
    runs-on: ubuntu-latest
    needs: smithy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go/go.mod'
      - name: Check service drift
        run: ./scripts/check-service-drift.sh
      - name: Check type freshness
        run: |
          cd go && go generate ./...
          cd ..
          test -z "$(git status --porcelain go/pkg/generated/)" || \
            (echo "ERROR: Go generated types are stale. Run 'cd go && go generate ./...'" && git status --porcelain go/pkg/generated/ && exit 1)
      - name: Check service freshness
        run: |
          cd go && go run ./cmd/generate-services/
          cd ..
          test -z "$(git status --porcelain go/pkg/fizzy/*_service.go)" || \
            (echo "ERROR: Go generated services are stale" && git status --porcelain go/pkg/fizzy/*_service.go && exit 1)
      - name: Test
        run: cd go && go test ./pkg/fizzy/... -count=1 -race -coverprofile=coverage.out
      - name: Coverage
        run: |
          cd go
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 15" | bc -l) )); then
            echo "Coverage below 15% threshold"
            exit 1
          fi

  test-typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    needs: smithy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install
        run: cd typescript && npm ci
      - name: Check service drift
        run: ./scripts/check-ts-service-drift.sh
      - name: Check service freshness
        run: |
          cd typescript && npx tsx scripts/generate-services.ts
          cd ..
          test -z "$(git status --porcelain typescript/src/generated/services/)" || \
            (echo "ERROR: TypeScript generated services are stale. Run 'make ts-generate-services'" && git status --porcelain typescript/src/generated/services/ && exit 1)
      - name: Lint
        run: cd typescript && npm run lint
      - name: Typecheck
        run: cd typescript && npm run typecheck
      - name: Test
        run: cd typescript && npm test
      - name: Build
        run: cd typescript && npm run build
      - name: Verify root pack
        run: npm pack --dry-run

  test-ruby:
    name: Ruby (${{ matrix.ruby }})
    runs-on: ubuntu-latest
    needs: smithy
    strategy:
      matrix:
        ruby: ['3.2', '3.3', '3.4', '4.0', 'head']
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: ${{ matrix.ruby == 'head' && 'default' || 'Gemfile.lock' }}
          bundler-cache: true
          working-directory: ruby
      - name: Check service drift
        if: matrix.ruby == '3.3'
        run: ./scripts/check-rb-service-drift.sh
      - name: Check service freshness
        if: matrix.ruby == '3.3'
        run: |
          ruby ruby/scripts/generate-services.rb
          test -z "$(git status --porcelain ruby/lib/fizzy/generated/services/)" || \
            (echo "ERROR: Ruby generated services are stale. Run 'make rb-generate-services'" && git status --porcelain ruby/lib/fizzy/generated/services/ && exit 1)
      - name: Lint
        if: matrix.ruby == '3.3'
        run: cd ruby && bundle exec rubocop
      - name: Test
        run: cd ruby && bundle exec rake test

  test-swift:
    name: Swift
    runs-on: macos-15
    needs: smithy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: cd swift && swift build
      - name: Check service drift
        run: ./scripts/check-swift-service-drift.sh
      - name: Check service freshness
        run: |
          cd swift && swift run FizzyGenerator --openapi ../openapi.json --behavior ../behavior-model.json --output Sources/Fizzy/Generated
          cd ..
          test -z "$(git status --porcelain swift/Sources/Fizzy/Generated/)" || \
            (echo "ERROR: Swift generated services are stale. Run 'make swift-generate'" && git status --porcelain swift/Sources/Fizzy/Generated/ && exit 1)
      - name: Test
        run: cd swift && swift test

  test-kotlin:
    name: Kotlin
    runs-on: ubuntu-latest
    needs: smithy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: corretto
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build
        run: cd kotlin && ./gradlew :fizzy-sdk:compileKotlinJvm
      - name: Check service drift
        run: ./scripts/check-kotlin-service-drift.sh
      - name: Check service freshness
        run: |
          cd kotlin && ./gradlew :generator:run
          cd ..
          test -z "$(git status --porcelain kotlin/sdk/src/commonMain/kotlin/com/basecamp/fizzy/generated/)" || \
            (echo "ERROR: Kotlin generated services are stale. Run 'make kt-generate-services'" && git status --porcelain kotlin/sdk/src/commonMain/kotlin/com/basecamp/fizzy/generated/ && exit 1)

  test-rust:
    name: Rust (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    needs: smithy
    strategy:
      fail-fast: false
      matrix:
        toolchain: [msrv, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the dev toolchain and would otherwise win over the
      # action's default, so both legs set RUSTUP_TOOLCHAIN explicitly: the msrv leg to
      # the crate's rust-version, the stable leg to the pinned channel.
      - name: Resolve toolchain
        id: toolchain
        env:
          LEG: ${{ matrix.toolchain }}
        run: |
          case "$LEG" in
            msrv)
              CHANNEL=$(cargo metadata --no-deps --format-version 1 --manifest-path rust/Cargo.toml \
                | jq -r '.packages[] | select(.name == "fizzy-sdk") | .rust_version')
              ;;
            stable)
              CHANNEL=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust/rust-toolchain.toml)
              ;;
          esac
          if [ -z "$CHANNEL" ] || [ "$CHANNEL" = null ]; then
            echo "::error::Could not resolve the $LEG toolchain"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$CHANNEL" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt

      - name: Verify the toolchain in both workspaces
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: |
          for dir in rust conformance/runner/rust; do
            (cd "$dir" && rustc --version && rustc --version | grep -F "rustc $CHANNEL")
          done

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.toolchain }}
          workspaces: |
            rust
            conformance/runner/rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-deny
        if: matrix.toolchain == 'stable'
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-deny

      - name: Lint
        if: matrix.toolchain == 'stable'
        run: make rs-lint

      # The MSRV leg builds the library alone on its exact rust-version; the generator
      # and the conformance runner are dev tooling and float on stable.
      - name: Test (library, every feature set)
        if: matrix.toolchain == 'msrv'
        run: make rs-test-lib rs-test-features

      - name: Test
        if: matrix.toolchain == 'stable'
        run: make rs-test rs-test-features

      - name: Docs
        if: matrix.toolchain == 'stable'
        run: make rs-doc

      - name: Deny
        if: matrix.toolchain == 'stable'
        run: make rs-deny

      # Regenerates into a temp dir and diffs, so a file the generator stopped emitting
      # fails too; then the operationId <-> route id census the other five languages run.
      - name: Check generated code drift
        if: matrix.toolchain == 'stable'
        run: make rs-check-drift

      - name: Publish dry run
        if: matrix.toolchain == 'stable'
        run: make rs-publish-check

      # Advisory until a published baseline exists on crates.io; the step is skipped
      # while the crate is unpublished rather than compared against nothing.
      - name: Check for a crates.io baseline
        if: matrix.toolchain == 'stable'
        id: baseline
        run: |
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A "fizzy-sdk CI (https://github.com/basecamp/fizzy-sdk)" \
            "https://crates.io/api/v1/crates/fizzy-sdk")
          echo "published=$([ "$STATUS" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "crates.io answered $STATUS for fizzy-sdk"

      - name: Semver check (advisory)
        if: matrix.toolchain == 'stable' && steps.baseline.outputs.published == 'true'
        continue-on-error: true
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          manifest-path: rust/fizzy-sdk/Cargo.toml
          package: fizzy-sdk

      - name: Dependency manifests unchanged by this job
        run: |
          test -z "$(git status --porcelain rust/Cargo.lock conformance/runner/rust/Cargo.lock)" || \
            (echo "ERROR: a Cargo.lock changed during CI" && git status --porcelain rust/Cargo.lock conformance/runner/rust/Cargo.lock && exit 1)

  conformance-go:
    name: Conformance (Go)
    needs: test-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go/go.mod'
      - name: Build runner
        run: cd conformance/runner/go && go build -o conformance-runner .
      - name: Run conformance
        run: cd conformance/runner/go && ./conformance-runner ../../tests/

  conformance-typescript:
    name: Conformance (TypeScript)
    needs: test-typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: cd typescript && npm ci && npm run build
      - run: cd conformance/runner/typescript && npm ci
      - run: cd conformance/runner/typescript && npx vitest run

  conformance-ruby:
    name: Conformance (Ruby)
    needs: test-ruby
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: conformance/runner/ruby
      - run: cd conformance/runner/ruby && bundle exec ruby runner.rb ../../tests/

  conformance-swift:
    name: Conformance (Swift)
    needs: test-swift
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make conformance-runner-tests-swift
      - run: make conformance-swift

  conformance-kotlin:
    name: Conformance (Kotlin)
    needs: test-kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: corretto
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: cd kotlin && ./gradlew :conformance:run

  conformance-rust:
    name: Conformance (Rust)
    needs: test-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve toolchain
        id: toolchain
        run: |
          CHANNEL=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust/rust-toolchain.toml)
          test -n "$CHANNEL"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$CHANNEL" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: conformance
          workspaces: |
            rust
            conformance/runner/rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: make conformance-runner-tests-rust
      - run: make conformance-rust

  lint-go:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go/go.mod'
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: go

  lint-actions:
    name: GitHub Actions audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false

  provenance:
    name: Provenance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check provenance sync
        run: diff -q spec/api-provenance.json go/pkg/fizzy/api-provenance.json

  rubric-check:
    name: Rubric Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check rubric audit
        run: make audit-check
