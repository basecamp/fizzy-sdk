overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Fizzy Go codegen overrides
  version: 0.0.0
actions:
  - target: $.components.schemas.Column.properties.color['$ref']
    description: Replace Column.color ref with allOf so oapi-codegen honors field extensions.
    remove: true
  - target: $.components.schemas.Column.properties.color
    description: Preserve optional pointer semantics for Column.color.
    update:
      allOf:
        - $ref: '#/components/schemas/Color'
      x-go-type-skip-optional-pointer: false
  - target: $.components.schemas.*.properties[?(@.type == 'array')]
    description: >-
      Tag every list field omitzero instead of omitempty. prefer-skip-optional-pointer
      makes optional lists plain slices, and omitempty on a slice drops a non-nil empty
      one, so a server-sent [] vanished on re-marshal and a caller couldn't send [] to
      clear a list. omitzero omits only a nil slice (absent stays absent) and keeps [].
      Required lists take omitzero too (the filter can't see the parent's required set):
      a nil one marshals as absent rather than null, and the server always sends them.
    update:
      x-omitempty: false
      x-omitzero: true
